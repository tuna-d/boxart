name: CI

on:
  push:
  pull_request:

jobs:
  checks:
    name: Lint, types and unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      # Route types such as PageProps are generated by Next.js, so create them before checking.
      - run: npm run typecheck
      - run: npm test

  e2e:
    name: End-to-end tests
    runs-on: ubuntu-latest
    needs: checks
    env:
      NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
      NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY }}
      IGDB_CLIENT_ID: ${{ secrets.IGDB_CLIENT_ID }}
      IGDB_CLIENT_SECRET: ${{ secrets.IGDB_CLIENT_SECRET }}
    steps:
      - name: Check for secrets
        id: secrets
        run: |
          if [ -z "$NEXT_PUBLIC_SUPABASE_URL" ] || [ -z "$IGDB_CLIENT_ID" ]; then
            echo "::notice::End-to-end tests skipped. Add the Supabase and IGDB repository secrets to run them."
            echo "ready=false" >> "$GITHUB_OUTPUT"
          else
            echo "ready=true" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/checkout@v4
        if: steps.secrets.outputs.ready == 'true'
      - uses: actions/setup-node@v4
        if: steps.secrets.outputs.ready == 'true'
        with:
          node-version: 22
          cache: npm
      - run: npm ci
        if: steps.secrets.outputs.ready == 'true'
      - run: npx playwright install --with-deps chromium
        if: steps.secrets.outputs.ready == 'true'
      - run: npm run build
        if: steps.secrets.outputs.ready == 'true'
      - run: npm run test:e2e
        if: steps.secrets.outputs.ready == 'true'
      - uses: actions/upload-artifact@v4
        if: failure() && steps.secrets.outputs.ready == 'true'
        with:
          name: playwright-report
          path: playwright-report
          retention-days: 7
